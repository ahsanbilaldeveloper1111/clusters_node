apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enterprise-app

resources:
  - ../../base

secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true

patches:
  - path: patches/replicas.yaml
  - path: patches/backend-resources.yaml
  - path: patches/ingress-production.yaml

# CD pipeline runs: kustomize edit set image enterprise-backend=ghcr.io/<repo>/backend:<tag>
images:
  - name: enterprise-backend
    newName: enterprise-backend
    newTag: latest
  - name: enterprise-frontend
    newName: enterprise-frontend
    newTag: latest
