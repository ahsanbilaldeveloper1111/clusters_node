# Blue/green deploy overlay (optional) — local clusters.
# Shared color Deployments: k8s/components/blue-green
#
# Bootstrap:  npm run k8s:blue-green:bootstrap
# New release: npm run k8s:blue-green:deploy -- <backend-tag> <frontend-tag>
# Cutover:     npm run k8s:blue-green:switch
# Status:      npm run k8s:blue-green:status
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enterprise-app

resources:
  - ../local
  - ../../components/blue-green

patches:
  - path: patches/service-color-selector.yaml
  - target:
      kind: Deployment
      name: backend
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: backend-hpa

images:
  - name: enterprise-backend
    newName: enterprise-backend
    newTag: local-v2
  - name: enterprise-frontend
    newName: enterprise-frontend
    newTag: local-v2
