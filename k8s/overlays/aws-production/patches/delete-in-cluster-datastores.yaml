# Use RDS + ElastiCache from Terraform instead of in-cluster Postgres/Redis
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: enterprise-app
$patch: delete
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: enterprise-app
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: enterprise-app
$patch: delete
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: enterprise-app
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: enterprise-app
$patch: delete
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: enterprise-app
$patch: delete
