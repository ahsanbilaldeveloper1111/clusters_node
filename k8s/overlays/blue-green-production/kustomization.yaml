# Blue/green for generic production clusters (GHCR images).
# Shared color Deployments: k8s/components/blue-green
# CD: scripts/k8s-cd-blue-green-prepare.sh + scripts/k8s-cd-blue-green-deploy.sh
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enterprise-app

resources:
  - ../production
  - ../../components/blue-green

patches:
  - path: patches/service-color-selector.yaml
  - target:
      kind: Deployment
      name: backend
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: backend-hpa

# CD: scripts/k8s-cd-blue-green-prepare.sh runs kustomize edit set image
images:
  - name: enterprise-backend
    newName: enterprise-backend
    newTag: latest
  - name: enterprise-frontend
    newName: enterprise-frontend
    newTag: latest
