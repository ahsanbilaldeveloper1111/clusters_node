# Production GitOps: scale app tier (Postgres stays 1 — single PVC)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: enterprise-app
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: enterprise-app
spec:
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: enterprise-app
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: enterprise-app
spec:
  replicas: 2
