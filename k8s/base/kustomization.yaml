apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enterprise-app

labels:
  - pairs:
      app.kubernetes.io/part-of: enterprise-advanced-app
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - backend-serviceaccount.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-hpa.yaml
  - backend-pdb.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - migrate-job.yaml
  - seed-job.yaml

# app-secrets is generated in overlays via secretGenerator

images:
  - name: enterprise-backend
    newName: enterprise-backend
    newTag: latest
  - name: enterprise-frontend
    newName: enterprise-frontend
    newTag: latest
