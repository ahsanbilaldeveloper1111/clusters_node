apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: enterprise-app
  labels:
    app.kubernetes.io/name: migrate-job
    app.kubernetes.io/component: migration
  annotations:
    # Run after install/upgrade; not a long-lived workload
    argocd.argoproj.io/hook: PostSync
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate-job
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do sleep 2; done
      containers:
        - name: migrate
          image: enterprise-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/dist/database/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
