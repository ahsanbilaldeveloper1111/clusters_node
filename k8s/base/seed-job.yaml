apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
  namespace: enterprise-app
  labels:
    app.kubernetes.io/name: seed-job
    app.kubernetes.io/component: seed
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed-job
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-migrate
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 15
      containers:
        - name: seed
          image: enterprise-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/dist/database/seed.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
