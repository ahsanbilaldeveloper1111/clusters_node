# CI — build, typecheck, database migrations, Docker image build
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://app_user:app_secret@localhost:5432/enterprise_db
  JWT_SECRET: ci-test-jwt-secret-min-16-chars
  REDIS_URL: redis://localhost:6379

jobs:
  build:
    name: Build TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build backend
        run: npm run build -w backend

      - name: Build frontend
        run: npm run build -w frontend

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize k8s/overlays/local > /tmp/k8s-local.yaml
          cp k8s/overlays/production/secrets.env.example k8s/overlays/production/secrets.env
          GITHUB_REPOSITORY="${{ github.repository }}" IMAGE_TAG=ci-test bash scripts/k8s-cd-prepare.sh
          kubectl kustomize k8s/overlays/production > /tmp/k8s-prod.yaml
          git checkout -- k8s/overlays/production/kustomization.yaml 2>/dev/null || true
          rm -f k8s/overlays/production/secrets.env
          cp k8s/overlays/aws-production/secrets.env.example k8s/overlays/aws-production/secrets.env
          AWS_ACCOUNT_ID=123456789012 IMAGE_TAG=ci-test bash scripts/k8s-aws-prepare.sh
          kubectl kustomize k8s/overlays/aws-production > /tmp/k8s-aws-prod.yaml
          git checkout -- k8s/overlays/aws-production/kustomization.yaml 2>/dev/null || true
          rm -f k8s/overlays/aws-production/secrets.env
          kubectl kustomize k8s/overlays/gitops > /tmp/k8s-gitops.yaml
          AWS_ACCOUNT_ID=123456789012 IMAGE_TAG=ci-test bash scripts/argocd-update-gitops-aws-images.sh
          kubectl kustomize k8s/overlays/gitops-aws > /tmp/k8s-gitops-aws.yaml
          git checkout -- k8s/overlays/gitops-aws/kustomization.yaml 2>/dev/null || true
          echo "Kustomize OK (local: $(wc -l < /tmp/k8s-local.yaml), prod: $(wc -l < /tmp/k8s-prod.yaml), aws: $(wc -l < /tmp/k8s-aws-prod.yaml), gitops: $(wc -l < /tmp/k8s-gitops.yaml), gitops-aws: $(wc -l < /tmp/k8s-gitops-aws.yaml) lines)"

      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7

  database:
    name: Migrations & seed
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_secret
          POSTGRES_DB: enterprise_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d enterprise_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run migrations
        run: npm run db:migrate -w backend

      - name: Run seed
        run: npm run db:seed -w backend

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: enterprise-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (Compose)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: enterprise-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (Kubernetes)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.k8s.Dockerfile
          push: false
          tags: enterprise-frontend-k8s:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker compose config
        run: docker compose config --quiet

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform
