# CD — build, push Docker images to GHCR + ECR, deploy to Kubernetes (optional)
name: CD

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*", "v*"]
  workflow_dispatch:
    inputs:
      deploy_kubernetes:
        description: Deploy to Kubernetes cluster (requires KUBE_CONFIG secret)
        required: false
        default: false
        type: boolean
      deploy_aws_eks:
        description: Deploy to AWS EKS (requires AWS credentials + terraform infra)
        required: false
        default: false
        type: boolean
      gitops_commit:
        description: Commit GHCR image tags to gitops overlay (for Argo CD)
        required: false
        default: false
        type: boolean
      gitops_commit_aws:
        description: Commit ECR image tags to gitops-aws overlay (Argo CD on AWS EKS)
        required: false
        default: false
        type: boolean
      deploy_lambda_documents:
        description: Build/push document-upload Lambda Docker image and update function
        required: false
        default: false
        type: boolean

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'enterprise-app' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'production' }}
  AWS_EKS_CLUSTER_NAME: ${{ vars.AWS_EKS_CLUSTER_NAME || 'enterprise-app-production' }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: docker/backend.Dockerfile
            image: backend
          - service: frontend
            dockerfile: docker/frontend.Dockerfile
            image: frontend
          - service: frontend-k8s
            dockerfile: docker/frontend.k8s.Dockerfile
            image: frontend-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ecr:
    name: Mirror images to ECR
    runs-on: ubuntu-latest
    needs: publish
    if: >-
      github.event_name != 'pull_request' &&
      (
        vars.PUSH_ECR == 'true' ||
        vars.DEPLOY_AWS_EKS == 'true' ||
        vars.DEPLOY_LAMBDA_DOCUMENTS == 'true' ||
        vars.USE_ARGOCD_GITOPS_AWS == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_aws_eks == true) ||
        (github.event_name == 'workflow_dispatch' && inputs.gitops_commit_aws == true) ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_lambda_documents == true)
      )
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Mirror backend and frontend-k8s to ECR
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          PROJECT: ${{ env.PROJECT_NAME }}
          ENV: ${{ env.ENVIRONMENT }}
        run: |
          set -euo pipefail
          BACKEND_GHCR="${REGISTRY}/${REPO}/backend:${SHA}"
          FRONTEND_GHCR="${REGISTRY}/${REPO}/frontend-k8s:${SHA}"
          BACKEND_ECR="${ECR_REGISTRY}/${PROJECT}-${ENV}/backend:${SHA}"
          FRONTEND_ECR="${ECR_REGISTRY}/${PROJECT}-${ENV}/frontend-k8s:${SHA}"
          BACKEND_ECR_LATEST="${ECR_REGISTRY}/${PROJECT}-${ENV}/backend:latest"
          FRONTEND_ECR_LATEST="${ECR_REGISTRY}/${PROJECT}-${ENV}/frontend-k8s:latest"

          docker pull "${BACKEND_GHCR}"
          docker pull "${FRONTEND_GHCR}"
          docker tag "${BACKEND_GHCR}" "${BACKEND_ECR}"
          docker tag "${FRONTEND_GHCR}" "${FRONTEND_ECR}"
          docker tag "${BACKEND_GHCR}" "${BACKEND_ECR_LATEST}"
          docker tag "${FRONTEND_GHCR}" "${FRONTEND_ECR_LATEST}"
          docker push "${BACKEND_ECR}"
          docker push "${FRONTEND_ECR}"
          docker push "${BACKEND_ECR_LATEST}"
          docker push "${FRONTEND_ECR_LATEST}"

          echo "Mirrored to ECR:"
          echo "  ${BACKEND_ECR}"
          echo "  ${FRONTEND_ECR}"

  lambda-documents:
    name: Lambda document-upload (Docker → ECR)
    runs-on: ubuntu-latest
    needs: publish
    if: >-
      github.event_name != 'pull_request' &&
      needs.publish.result == 'success' &&
      (
        vars.PUSH_ECR == 'true' ||
        vars.DEPLOY_LAMBDA_DOCUMENTS == 'true' ||
        vars.DEPLOY_AWS_EKS == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_lambda_documents == true) ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_aws_eks == true)
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, push Lambda image, and update function
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_DOCUMENTS_FUNCTION_NAME }}
        run: bash scripts/lambda-document-upload-cd.sh

      - name: Lambda deployment summary
        env:
          SHA: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT: ${{ env.PROJECT_NAME }}
          ENV: ${{ env.ENVIRONMENT }}
          LAMBDA_DOCUMENTS_FUNCTION_NAME: ${{ vars.LAMBDA_DOCUMENTS_FUNCTION_NAME }}
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          FN="${LAMBDA_DOCUMENTS_FUNCTION_NAME:-${PROJECT}-${ENV}-document-upload}"
          {
            echo "## Lambda document-upload — deployed"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Function | \`${FN}\` |"
            echo "| Image | \`${ECR}/${PROJECT}-${ENV}/document-upload-lambda:${SHA}\` |"
            echo "| API | Run \`terraform output documents_api_url\` after infra apply |"
            echo ""
            echo "See [docs/LAMBDA_DOCUMENTS.md](docs/LAMBDA_DOCUMENTS.md)"
          } >> "$GITHUB_STEP_SUMMARY"

  kubernetes:
    name: Kubernetes deploy
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Write production secrets
        working-directory: k8s/overlays/production
        run: |
          if [[ -n "${{ secrets.K8S_SECRETS_ENV }}" ]]; then
            printf '%s' "${{ secrets.K8S_SECRETS_ENV }}" > secrets.env
          else
            cp secrets.env.example secrets.env
            echo "::warning::Using secrets.env.example — set repository secret K8S_SECRETS_ENV for production"
          fi

      - name: Set GHCR image tags
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash scripts/k8s-cd-prepare.sh

      - name: Validate manifests
        run: |
          kubectl kustomize k8s/overlays/production > /tmp/k8s-production.yaml
          echo "Rendered $(wc -l < /tmp/k8s-production.yaml) lines"

      - name: Upload Kubernetes manifests
        uses: actions/upload-artifact@v4
        with:
          name: k8s-production-manifests
          path: /tmp/k8s-production.yaml
          retention-days: 30

      - name: Deploy to cluster
        if: >-
          vars.DEPLOY_K8S == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_kubernetes == true)
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [[ -z "$KUBE_CONFIG" ]]; then
            echo "::error::KUBE_CONFIG secret is required for deploy. Add base64-encoded kubeconfig to repository secrets."
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl apply -k k8s/overlays/production
          kubectl delete job db-migrate db-seed -n enterprise-app --ignore-not-found
          kubectl apply -k k8s/overlays/production
          kubectl wait --for=condition=available deployment/postgres -n enterprise-app --timeout=300s
          kubectl wait --for=condition=complete job/db-migrate -n enterprise-app --timeout=180s || true
          kubectl wait --for=condition=complete job/db-seed -n enterprise-app --timeout=180s || true
          kubectl rollout status deployment/backend -n enterprise-app --timeout=300s
          kubectl rollout status deployment/frontend -n enterprise-app --timeout=300s

      - name: Deployment summary
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## CD — Published images (GHCR)"
            echo ""
            echo "| Service | Image |"
            echo "|---------|-------|"
            echo "| backend | \`${REGISTRY}/${REPO}/backend:${SHA}\` |"
            echo "| frontend (Compose) | \`${REGISTRY}/${REPO}/frontend:${SHA}\` |"
            echo "| frontend (K8s) | \`${REGISTRY}/${REPO}/frontend-k8s:${SHA}\` |"
            echo ""
            echo "## Kubernetes — manual deploy (in-cluster Postgres/Redis)"
            echo ""
            echo "Download artifact **k8s-production-manifests** or run:"
            echo '```bash'
            echo "export GITHUB_REPOSITORY=${REPO}"
            echo "export IMAGE_TAG=${SHA}"
            echo "bash scripts/k8s-cd-prepare.sh"
            echo "kubectl apply -k k8s/overlays/production"
            echo '```'
            echo ""
            echo "## Auto-deploy (optional)"
            echo ""
            echo "1. Add secret \`KUBE_CONFIG\` (base64 kubeconfig)"
            echo "2. Add secret \`K8S_SECRETS_ENV\` (contents of production secrets.env)"
            echo "3. Set variable \`DEPLOY_K8S=true\` **or** run workflow with **deploy_kubernetes** checked"
            echo ""
            echo "## AWS EKS (RDS + ElastiCache)"
            echo ""
            echo "Set \`PUSH_ECR=true\` and/or \`DEPLOY_AWS_EKS=true\`, or run with **deploy_aws_eks** checked."
            echo "See [docs/AWS_DEPLOYMENT.md](docs/AWS_DEPLOYMENT.md)"
            echo ""
            echo "## Lambda document-upload (Docker)"
            echo ""
            echo "Set \`DEPLOY_LAMBDA_DOCUMENTS=true\` or run CD with **deploy_lambda_documents** checked."
            echo "Requires Terraform \`enable_documents_lambda=true\` (creates Lambda + API Gateway + S3)."
            echo "See [docs/LAMBDA_DOCUMENTS.md](docs/LAMBDA_DOCUMENTS.md)"
            echo ""
            echo "## Argo CD GitOps (recommended)"
            echo ""
            echo "Set \`USE_ARGOCD_GITOPS=true\` or run with **gitops_commit** — updates \`k8s/overlays/gitops\` and Argo CD syncs."
            echo "See [docs/ARGOCD.md](docs/ARGOCD.md)"
          } >> "$GITHUB_STEP_SUMMARY"

  aws-kubernetes:
    name: AWS EKS deploy
    runs-on: ubuntu-latest
    needs: [publish, ecr]
    if: >-
      github.event_name != 'pull_request' &&
      needs.publish.result == 'success' &&
      needs.ecr.result == 'success' &&
      (
        vars.DEPLOY_AWS_EKS == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_aws_eks == true)
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${{ env.AWS_REGION }}" \
            --name "${{ env.AWS_EKS_CLUSTER_NAME }}"
          kubectl get nodes

      - name: Write AWS production secrets
        env:
          K8S_AWS_SECRETS_ENV: ${{ secrets.K8S_AWS_SECRETS_ENV }}
        run: |
          if [[ -n "$K8S_AWS_SECRETS_ENV" ]]; then
            printf '%s' "$K8S_AWS_SECRETS_ENV" > k8s/overlays/aws-production/secrets.env
          else
            bash scripts/k8s-aws-sync-secrets.sh
          fi

      - name: Set ECR image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: bash scripts/k8s-aws-prepare.sh

      - name: Validate AWS manifests
        run: |
          kubectl kustomize k8s/overlays/aws-production > /tmp/k8s-aws-production.yaml
          echo "Rendered $(wc -l < /tmp/k8s-aws-production.yaml) lines"

      - name: Upload AWS Kubernetes manifests
        uses: actions/upload-artifact@v4
        with:
          name: k8s-aws-production-manifests
          path: /tmp/k8s-aws-production.yaml
          retention-days: 30

      - name: Deploy to AWS EKS
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: bash scripts/k8s-aws-deploy.sh

      - name: AWS deployment summary
        env:
          SHA: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          CLUSTER: ${{ env.AWS_EKS_CLUSTER_NAME }}
          PROJECT: ${{ env.PROJECT_NAME }}
          ENV: ${{ env.ENVIRONMENT }}
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          {
            echo "## AWS EKS — Deployed"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Cluster | \`${CLUSTER}\` |"
            echo "| Region | \`${AWS_REGION}\` |"
            echo "| Backend image | \`${ECR}/${PROJECT}-${ENV}/backend:${SHA}\` |"
            echo "| Frontend image | \`${ECR}/${PROJECT}-${ENV}/frontend-k8s:${SHA}\` |"
            echo "| Overlay | \`k8s/overlays/aws-production\` |"
            echo ""
            echo "Artifact: **k8s-aws-production-manifests**"
            echo ""
            echo "Manual redeploy:"
            echo '```bash'
            echo "export IMAGE_TAG=${SHA}"
            echo "bash scripts/k8s-aws-sync-secrets.sh"
            echo "bash scripts/k8s-aws-deploy.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gitops:
    name: Argo CD GitOps — update manifests
    runs-on: ubuntu-latest
    needs: [publish, ecr]
    if: >-
      github.event_name != 'pull_request' &&
      needs.publish.result == 'success' &&
      (needs.ecr.result == 'success' || needs.ecr.result == 'skipped')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Update gitops image tags (GHCR)
        if: >-
          vars.USE_ARGOCD_GITOPS == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.gitops_commit == true)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash scripts/argocd-update-gitops-images.sh

      - name: Configure AWS credentials (gitops-aws)
        if: >-
          vars.USE_ARGOCD_GITOPS_AWS == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.gitops_commit_aws == true)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update gitops-aws ECR image tags
        if: >-
          vars.USE_ARGOCD_GITOPS_AWS == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.gitops_commit_aws == true)
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: bash scripts/argocd-update-gitops-aws-images.sh

      - name: Commit and push gitops overlays
        if: >-
          vars.USE_ARGOCD_GITOPS == 'true' ||
          vars.USE_ARGOCD_GITOPS_AWS == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.gitops_commit == true) ||
          (github.event_name == 'workflow_dispatch' && inputs.gitops_commit_aws == true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/gitops/kustomization.yaml
          git add k8s/overlays/gitops-aws/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No gitops image changes to commit"
            exit 0
          fi
          git commit -m "chore(gitops): set images to ${{ github.sha }}"
          git push
